
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>픽셀 아트 테스트</title>

<style>
    body {
        margin: 0;
        background: #171923;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        margin-top: 30px;
        color: #c4a7ff;
    }

    .controls {
        margin: 20px;
    }

    button, input {
        margin: 5px;
        padding: 10px;
        border: none;
        border-radius: 6px;
    }

    button {
        background: #8b6ce8;
        color: white;
        cursor: pointer;
    }

    canvas {
        display: block;
        margin: 20px auto;
        width: min(90vw, 960px);
        height: auto;
        border: 3px solid #8b6ce8;
        border-radius: 8px;
        background: #333;
    }

    #info {
        color: #c4c4d4;
    }
</style>
</head>

<body>

<h1>PIXEL ART TEST</h1>
<p>직접 그린 픽셀 그림을 불러와 보세요!</p>

<div class="controls">
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp">

    <br>

    <button onclick="setZoom(1)">1배</button>
    <button onclick="setZoom(2)">2배</button>
    <button onclick="setZoom(3)">3배</button>
    <button onclick="setZoom(4)">4배</button>
    <button onclick="setZoom(6)">6배</button>
    <button onclick="setZoom(8)">8배</button>
</div>

<p id="info">아직 그림이 등록되지 않았습니다.</p>

<canvas id="gameCanvas" width="960" height="540"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const fileInput = document.getElementById("fileInput");
const info = document.getElementById("info");

let image = null;
let zoom = 4;

// 픽셀 그림의 흐릿함 방지
ctx.imageSmoothingEnabled = false;

// 배경 그리기
function drawBackground() {
    const size = 20;

    for (let y = 0; y < canvas.height; y += size) {
        for (let x = 0; x < canvas.width; x += size) {
            const odd = (x / size + y / size) % 2;

            ctx.fillStyle = odd ? "#444" : "#555";
            ctx.fillRect(x, y, size, size);
        }
    }
}

// 화면 그리기
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();

    if (!image) return;

    ctx.imageSmoothingEnabled = false;

    const width = image.naturalWidth * zoom;
    const height = image.naturalHeight * zoom;

    const x = Math.floor((canvas.width - width) / 2);
    const y = Math.floor((canvas.height - height) / 2);

    ctx.drawImage(image, x, y, width, height);
}

// 배율 변경
function setZoom(value) {
    zoom = value;
    draw();
}

// 이미지 불러오기
fileInput.addEventListener("change", function(event) {
    const file = event.target.files[0];

    if (!file) return;

    const url = URL.createObjectURL(file);
    const newImage = new Image();

    newImage.onload = function() {
        if (image && image.src.startsWith("blob:")) {
            URL.revokeObjectURL(image.src);
        }

        image = newImage;

        info.textContent =
            `파일: ${file.name} | 크기: ${image.naturalWidth} × ${image.naturalHeight}px`;

        draw();
    };

    newImage.onerror = function() {
        info.textContent = "이미지를 불러오지 못했습니다.";
        URL.revokeObjectURL(url);
    };

    newImage.src = url;
});

// 처음 화면
draw();
</script>

</body>
</html>
