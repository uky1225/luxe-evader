function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2100)}
function addItem(n){if(!inventory.includes(n)){inventory.push(n);const tips={'멀티툴':'사용법: R키로 십자 드라이버·칼·톱·육각 드라이버를 선택합니다. 선택한 도구로 주변 장치를 조사하세요.','작은 열쇠':'사용법: 잠긴 상자나 문 가까이에서 F키를 눌러 열 수 있는지 확인하세요.','석수':'사용법: E키 가방에서 석수 마시기를 선택하면 정신력이 회복됩니다.','에너지바':'사용법: E키 가방에서 에너지바 사용을 선택하면 체력과 정신력이 회복됩니다.','영원 펜':'사용법: 노트와 함께 단서를 기록할 때 쓰는 펜입니다.','사진 조각':'사용법: 다른 사진 조각이나 기록과 대조해 단서를 완성하세요.','황동 열쇠':'사용법: 열쇠가 맞는 잠금장치 근처에서 F키로 사용합니다.','은색 열쇠':'사용법: 위층의 잠긴 문이나 수납장을 열 때 사용합니다.','일지':'사용법: E키 가방에서 소지품과 단서를 확인할 때 일지 내용을 다시 읽을 수 있습니다.','권총':'사용법: 특수한 존재의 능력을 봉인하는 단발 권총입니다. 꼭 필요한 순간까지 아껴 두세요.','지하 열쇠':'사용법: 저택의 잠긴 지하 통로 앞에서 F키를 누르세요.'};say('아이템 획득: '+n+'\n\n'+(tips[n]||'사용법: E키를 눌러 가방에서 아이템과 단서를 확인하세요.'));}}
function say(text,buttons=[['확인',closeDialog]]){$('dialogText').textContent=text;$('dialogExtra').innerHTML='';$('choices').innerHTML='';buttons.forEach(([label,fn])=>{let b=document.createElement('button');b.className='main';b.textContent=label;b.onclick=fn;$('choices').appendChild(b)});$('dialog').style.display='flex';dialogOpen=true}
function closeDialog(){$('dialog').style.display='none';dialogOpen=false}
function puzzle(title,text,answer,success){$('dialogText').textContent=title+'\n'+text;$('dialogExtra').innerHTML='<input id="answer" maxlength="12" placeholder="정답 입력">';$('choices').innerHTML='';let b=document.createElement('button');b.className='main';b.textContent='확인';b.onclick=()=>{let v=$('answer').value.trim().toLowerCase();if(v===answer.toLowerCase()){closeDialog();success()}else toast('아직 맞지 않는 것 같다…')};$('choices').append(b);let x=document.createElement('button');x.className='main';x.textContent='취소';x.onclick=closeDialog;$('choices').append(x);$('dialog').style.display='flex';dialogOpen=true}
function interact(){if(dialogOpen)return;let r=rooms[room],near=r.objects.map(o=>({...{o},d:Math.hypot(player.x-o[1],player.y-o[2])})).sort((a,b)=>a.d-b.d)[0];if(!near||near.d>100){toast('주변에는 조사할 것이 없다.');return}let [id,x,y,name]=near.o;
if(room===0&&id==='rope'){if(!flags.rope){flags.rope=true;say('Luxe: …밧줄이 느슨해졌다. 손목을 비틀어 풀 수 있겠어.\n\n멀티툴을 이용해 밧줄을 끊었다.');addItem('멀티툴')}else toast('이미 풀린 밧줄이다.');return}
if(room===0&&id==='shelf'){say('책장 뒤쪽에서 아이의 목소리가 들린다.\n귀신 아이: “문은 잠겨 있어. 보일러실에 열쇠가 있을 거야.”');return}
if(room===0&&id==='door'){if(flags.rope){room=1;player.x=80;toast('보일러실로 이동했다.')}else toast('먼저 밧줄을 풀어야 한다.');return}
if(room===1&&id==='boiler'){puzzle('보일러 밸브','벽에 적힌 숫자: 2 · 4 · 6 · ?\n규칙을 찾아 다음 숫자를 입력하자.','8',()=>{flags.boiler=true;addItem('작은 열쇠');say('밸브가 돌아가며 보일러 뒤의 작은 열쇠가 떨어졌다.')});return}
if(room===1&&id==='box'){if(inventory.includes('작은 열쇠')){flags.box=true;addItem('석수');say('공구함 안에서 물병을 찾았다.');}else toast('열쇠 구멍이 있다.');return}
if(room===1&&id==='stairs'){room=2;player.x=80;toast('1층으로 올라왔다.');return}
if(room===2&&id==='portrait'){puzzle('가족사진','사진 뒷면에 적힌 문장: “밤은 낮보다 어둡다.”\n밤을 숫자로 바꾸면? (시계 기준)','12',()=>{flags.photo=true;addItem('사진 조각');say('사진 뒷면이 열리며 조각이 떨어졌다.')});return}
if(room===3&&id==='books'){puzzle('책장 암호','책등의 색 순서가 무지개에서 첫 번째, 세 번째, 다섯 번째 색이다.\n색의 개수는?','3',()=>{flags.books=true;addItem('황동 열쇠');say('책장이 움직이며 황동 열쇠가 나타났다.')});return}
if(room===4&&id==='cabinet'){addItem('에너지바');say('찬장 안쪽에서 수상한 에너지바를 찾았다.');return}
if(room===5&&id==='toy'){puzzle('장난감 상자','상자에 적힌 수수께끼: 다리가 네 개지만 걷지 못하는 것은?','책상',()=>{flags.toy=true;addItem('영원 펜');say('장난감 아래 영원 펜이 숨겨져 있었다.')});return}
if(room===6&&id==='mirror'){say('거울에 희미한 글씨가 보인다.\n“진실은 위층, 세 번째 방에.”');return}
if(room===7&&id==='piano'){puzzle('피아노','건반에 새겨진 숫자 1, 1, 2, 3, 5, ?','8',()=>{flags.piano=true;addItem('은색 열쇠');say('피아노 내부에서 은색 열쇠를 찾았다.')});return}
if(room===8&&id==='diary'){say('살루만의 일지 일부\n“아이들의 공포는 문을 연다. 연구소의 기록을 지하에 숨겼다.”\n\n귀신 아이: “이제 마지막 진실을 찾아줘.”');addItem('일지');return}
if(room===9&&id==='machine'){puzzle('연구 장치','기록에 적힌 식: 5 × 3 - 4','11',()=>{flags.machine=true;addItem('권총');say('실험 장치가 열리며 특수 권총이 나왔다. 한 발만 남아 있다.')});return}
if(room===10&&id==='mirror'){say('거울 뒤에서 차가운 금속 소리가 난다.');addItem('지하 열쇠');return}
if(id==='door'){if(room===2){room=3}else if(room===3){room=4}else if(room===4){room=5}else if(room===5){room=6}else if(room===6){room=7}else if(room===7){room=8}else if(room===8){room=9}else if(room===9){room=10}else if(room===10){if(inventory.includes('지하 열쇠')){say('열쇠가 맞는다. 저택의 지하 깊은 곳으로 이어지는 비밀 통로가 열린다.\n\n귀신 아이: “기록을 찾아. 이곳에서 무슨 일이 있었는지 세상에 알려줘.”',[['엔딩으로',()=>{closeDialog();ending()}]]);}else toast('잠겨 있다. 열쇠가 필요하다.');}else toast('문은 잠겨 있다.');return}
say(name+'을(를) 조사했다. 특별한 단서는 아직 없다.');
}
function ending(){say('진실의 기록\n\n공상 실현 연구소는 사람들의 공포를 이용해 아이들을 납치하고 실험했다. 살루만은 그 비밀을 숨기기 위해 저택을 감옥으로 만들었다.\n\nLuxe는 기록을 품에 안고 새벽의 빗속으로 걸어 나왔다.\n\n— 1장 끝 —',[['처음으로',()=>location.reload()]])}
function update(){if(!game||dialogOpen)return;let dx=0,dy=0;if(keys.ArrowLeft||keys.a||keys.A)dx--;if(keys.ArrowRight||keys.d||keys.D)dx++;if(keys.ArrowUp||keys.w||keys.W)dy--;if(keys.ArrowDown||keys.s||keys.S)dy++;let len=Math.hypot(dx,dy)||1;player.x=Math.max(55,Math.min(905,player.x+dx/len*player.speed));player.y=Math.max(115,Math.min(470,player.y+dy/len*player.speed));frame++;if(frame%60===0&&mind>0)mind=Math.max(0,mind-(room===0?0:.2));$('mind').textContent=Math.floor(mind);$('hp').textContent='♥'.repeat(hp)+'♡'.repeat(3-hp);$('floor').textContent=rooms[room].name;drawMap()}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}
function draw(){ctx.clearRect(0,0,960,540);let r=rooms[room];rect(0,0,960,540,'#17131e');rect(28,35,904,475,'#514653');rect(38,45,884,455,'#292431');rect(48,55,864,435,'#332c39');
for(let x=55;x<920;x+=48)for(let y=60;y<490;y+=48){ctx.strokeStyle='#ffffff08';ctx.strokeRect(x,y,48,48)}
rect(0,0,960,35,'#100d17');rect(0,505,960,35,'#100d17');ctx.fillStyle='#c8b7d6';ctx.font='18px serif';ctx.fillText(r.name,55,27);
r.objects.forEach(([id,x,y,name])=>{ctx.save();if(id==='door'){rect(x-30,y-65,60,130,'#493044');rect(x-24,y-59,48,118,'#75566c');rect(x+15,y,5,5,'#d7b66e')}else if(id==='rope'){rect(x-35,y-8,70,16,'#b49b83');ctx.strokeStyle='#dfc9a7';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.stroke()}else if(id==='shelf'||id==='books'){rect(x-48,y-60,96,120,'#50392e');for(let i=0;i<5;i++){rect(x-42+i*18,y-50,13,95,['#79546b','#7c6549','#536d70','#8a6e9a'][i%4])}}else{rect(x-40,y-28,80,56,id==='boiler'?'#59616a':id==='piano'?'#17131b':'#685345');rect(x-34,y-22,68,44,'#00000022')}ctx.fillStyle='#ddd1e4';ctx.font='13px serif';ctx.textAlign='center';ctx.fillText(name,x,y+52);ctx.restore()});
 // ambient light pool
 let g=ctx.createRadialGradient(player.x,player.y,5,player.x,player.y,175);g.addColorStop(0,'#d9c6ff20');g.addColorStop(1,'#09071100');ctx.fillStyle=g;ctx.fillRect(0,35,960,470);
 // player pixel sprite
 ctx.fillStyle='#15101b';ctx.fillRect(player.x-10,player.y-22,20,30);ctx.fillStyle='#d5b4a4';ctx.fillRect(player.x-8,player.y-34,16,14);ctx.fillStyle='#24202b';ctx.fillRect(player.x-9,player.y-37,18,8);ctx.fillStyle='#a68bc6';ctx.fillRect(player.x-9,player.y-7,18,14);ctx.fillStyle='#c9b9db';ctx.fillRect(player.x-7,player.y+7,5,12);ctx.fillRect(player.x+3,player.y+7,5,12);
 // ghost hint
 if(room===0){ctx.globalAlpha=.55+.25*Math.sin(frame/20);ctx.fillStyle='#bba7d9';ctx.fillRect(690,150,18,30);ctx.fillRect(685,145,28,13);ctx.globalAlpha=1}
 // prompt
 let nearest=r.objects.map(o=>({o,d:Math.hypot(player.x-o[1],player.y-o[2])})).sort((a,b)=>a.d-b.d)[0];let h=$('hint');if(nearest&&nearest.d<100){h.textContent='F  조사하기 · '+nearest.o[3];h.classList.add('show')}else h.classList.remove('show');
}
function drawMap(){mc.clearRect(0,0,100,100);mc.fillStyle='#21172e';mc.fillRect(5,5,90,90);mc.strokeStyle='#8b70a8';mc.strokeRect(8,8,84,84);for(let i=0;i<11;i++){mc.fillStyle=i===room?'#d7b5ff':(i<room?'#896ca5':'#51435e');let x=14+(i%4)*22,y=16+Math.floor(i/4)*25;mc.fillRect(x,y,10,10)}mc.fillStyle='#fff';mc.fillRect(14+(room%4)*22,16+Math.floor(room/4)*25,4,4)}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.repeat)return;if(e.key.toLowerCase()==='f')interact();if(e.key.toLowerCase()==='e')showInventory();if(e.key.toLowerCase()==='r')showTools()});
window.addEventListener('keyup',e=>keys[e.key]=false);
function showInventory(){let txt='가방 / 단서\n\n'+(inventory.length?inventory.join('\n'):'아직 가진 아이템이 없다.')+'\n\n아이템을 선택하면 사용할 수 있다.';say(txt,[['닫기',closeDialog],['에너지바 사용',()=>{if(inventory.includes('에너지바')){hp=Math.min(3,hp+1);mind=Math.min(100,mind+10);inventory=inventory.filter(x=>x!=='에너지바');toast('체력과 정신력이 회복됐다.')}else toast('에너지바가 없다.');closeDialog()}],['석수 마시기',()=>{if(inventory.includes('석수')){mind=Math.min(100,mind+25);inventory=inventory.filter(x=>x!=='석수');toast('정신력이 회복됐다.')}else toast('석수가 없다.');closeDialog()}]])}
function showTools(){say('멀티툴 선택\n현재 도구: '+tools[tool]+'\n\nR키를 다시 누르거나 아래에서 도구를 선택하세요.',tools.map((t,i)=>[t,()=>{tool=i;closeDialog();toast('도구 선택: '+t)}]).concat([['닫기',closeDialog]]))}
$('start').onclick=()=>{game=true;$('overlay').style.display='none';say('Luxe: …여긴 어디지? 손목이 묶여 있어.\n\n[조작 안내]\nWASD / 방향키: 이동\nF: 주변 조사 및 상호작용\nE: 가방·아이템·단서 확인\nR: 멀티툴 도구 선택\n\n가까이 다가가 F를 눌러 주변을 조사하세요. 아이템을 처음 얻으면 사용법을 안내합니다.');};
document.querySelectorAll('[data-dir]').forEach(b=>{let k={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[b.dataset.dir];b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();let k=b.dataset.key;if(k==='f')interact();if(k==='e')showInventory();if(k==='r')showTools()}));
</script></body></html>
